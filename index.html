<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PBUM Member ID Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f6f3eb;
      color: #2f3a32;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;

      background: rgba(255, 255, 255, 0.96);

      padding: 42px 36px;

      border-radius: 24px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    /* Logo */
    .logo {
      width: 78px;
      height: 78px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: #dfe8dc;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;

      color: #526b55;
    }

    /* Heading */
    h1 {
      margin: 0;

      font-size: 28px;

      font-weight: 700;

      color: #344b38;
    }

    .subtitle {
      margin-top: 10px;
      margin-bottom: 34px;

      color: #788178;

      font-size: 15px;

      line-height: 1.6;
    }

    /* Form */
    .form-group {
      text-align: left;

      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #4c5b50;
    }

    input {
      width: 100%;

      padding: 15px 16px;

      border: 1px solid #d8ddd6;

      border-radius: 12px;

      background: #fafbf9;

      font-size: 16px;

      color: #2f3a32;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #718b73;

      background: white;

      box-shadow: 0 0 0 3px rgba(113, 139, 115, 0.12);
    }

    /* Button */
    button {
      width: 100%;

      margin-top: 4px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #526b55;

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #435947;

      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    /* Result */
    #result {
      margin-top: 28px;
    }

    .result-card {
      padding: 24px;

      border-radius: 16px;

      background: #f1f6ef;

      border: 1px solid #dce8d9;
    }

    .result-title {
      font-size: 14px;

      color: #6f7c71;

      margin-bottom: 10px;
    }

    .member-id {
      font-size: 25px;

      font-weight: 700;

      color: #435947;

      letter-spacing: 0.5px;
    }

    .error {
      padding: 18px;

      border-radius: 14px;

      background: #fff4f2;

      border: 1px solid #f1d7d2;

      color: #8a554d;

      font-size: 14px;

      line-height: 1.5;
    }

    /* Footer */
    .footer {
      margin-top: 32px;

      font-size: 12px;

      color: #9a9f9a;

      line-height: 1.7;
    }

    .motto {
      margin-top: 4px;

      font-style: italic;

      color: #718071;
    }

    /* Mobile */
    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .container {
        padding: 34px 24px;

        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- PBUM Logo Placeholder -->
    <div class="logo">
      PBUM
    </div>

    <h1>Find Your Member ID</h1>

    <div class="subtitle">
      Enter your UM Student ID to retrieve your
      PBUM Membership ID.
    </div>


    <!-- Search Form -->
    <div class="form-group">

      <label for="studentId">
        Student ID
      </label>

      <input
        id="studentId"
        type="text"
        placeholder="e.g. 23012345"
        autocomplete="off"
      >

    </div>


    <button
      id="searchButton"
      onclick="findMemberId()"
    >
      FIND MY MEMBER ID
    </button>


    <!-- Result -->
    <div id="result"></div>


    <!-- Footer -->
    <div class="footer">

      Persatuan Buddhis Universiti Malaya

      <div class="motto">
        Stride the Noble Path
      </div>

      <div>
        © 2026 PBUM
      </div>

    </div>

  </div>


  <script>

    async function findMemberId() {

      const studentId =
        document.getElementById("studentId").value.trim();

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("searchButton");


      // Check input
      if (!studentId) {

        result.innerHTML =
          '<div class="error">' +
          'Please enter your Student ID.' +
          '</div>';

        return;
      }


      // Loading
      button.disabled = true;

      button.textContent = "SEARCHING...";

      result.innerHTML = "";


      try {

        const response = await fetch(
          `/api/member-id?studentId=${encodeURIComponent(studentId)}`
        );


        const data = await response.json();


        // Found
        if (data.found) {

          result.innerHTML =

            '<div class="result-card">' +

              '<div class="result-title">' +
              'Your Member ID' +
              '</div>' +

              '<div class="member-id">' +
              data.memberId +
              '</div>' +

            '</div>';

        }


        // Not found
        else {

          result.innerHTML =

            '<div class="error">' +

              '<strong>Member ID Not Found</strong>' +

              '<br><br>' +

              'Please check your Student ID and try again.' +

            '</div>';

        }

      }


      catch (error) {

        console.error(error);

        result.innerHTML =

          '<div class="error">' +

            '<strong>Something went wrong.</strong>' +

            '<br><br>' +

            'Please try again later.' +

          '</div>';

      }


      // Reset button
      button.disabled = false;

      button.textContent = "FIND MY MEMBER ID";

    }


    // Allow Enter key
    document
      .getElementById("studentId")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          findMemberId();

        }

      });

  </script>

</body>

</html>
